[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-buff-tradeup-scanner"
version = "0.1.0"
description = "Read-only CS2 BUFF trade-up opportunity scanner with bounded multi-recipe enumeration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "httpx>=0.27,<1.0",
  "apscheduler>=3.10,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<6.0",
  "websockets>=17,<18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "mypy>=1.10,<2.0",
  "ruff>=0.5,<1.0",
]

[tool.setuptools]
packages = ["app", "app.clients", "app.jobs", "app.models", "app.repositories", "app.services", "app.utils", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
